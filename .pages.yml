# Beheerpaneel voor Pages CMS (https://app.pagescms.org). Elke opslag is een commit; Cloudflare Pages bouwt de site daarna opnieuw (± 2 min).
# Prijzen, voorraad (uitverkocht) en verzendkosten staan hier ook: afrekenen (Mollie) rekent met precies deze bedragen.
media:
  input: public/img
  output: /img
  extensions: [jpg, jpeg, png, webp]

content:
  - name: products
    label: Producten
    type: file
    path: content/products.json
    format: json
    list: true
    fields:
      - { name: name, label: Naam, type: string, required: true, description: "Zoals op de site, zonder 'Thobe' ervoor (bijv. White Desert)." }
      - { name: slug, label: Adres van de pagina, type: string, required: true, description: "Kleine letters en streepjes, bijv. white-desert → thoby3.com/product/white-desert. Niet meer wijzigen na livegang." }
      - { name: kind, label: Soort, type: select, required: true, options: { values: [thobe, accessory] }, description: "thobe = met maten en pasvormen; accessory = zonder maten (Musk, Siwak)." }
      - { name: tagline, label: Korte omschrijving, type: text, description: "Eén zin onder de naam en in Google." }
      - { name: description, label: Beschrijving (alinea's), type: text, list: true }
      - name: color
        label: Kleur
        type: object
        fields:
          - { name: name, label: Naam van de kleur, type: string, description: "Bijv. Gebroken wit" }
          - { name: hex, label: Kleurcode, type: string, description: "Bijv. #EFEAE0 (voor het kleurbolletje)" }
      - name: images
        label: Hoofdfoto's
        type: object
        fields:
          - { name: primary, label: Productfoto, type: image, required: true, description: "Staande foto (3:4) op lichte achtergrond." }
          - { name: lifestyle, label: Sfeerfoto (bij muis erop), type: image }
          - { name: detail, label: Detailfoto, type: image }
      - { name: gallery, label: "Foto's op de productpagina (eerste = grote foto)", type: image, options: { multiple: true } }
      - { name: price, label: Prijs (€ incl. btw), type: number, required: true }
      - { name: compareAt, label: Van-prijs (€), type: number, description: "Alleen zichtbaar als 'Van-prijs tonen' aanstaat (Winkel). Moet hoger zijn dan de prijs." }
      - { name: soldOut, label: Uitverkocht, type: boolean, description: "Aan = niet te bestellen; de site toont 'Binnenkort terug'." }

  - name: shop
    label: Winkel, maten & verzending
    type: file
    path: content/shop.json
    format: json
    fields:
      - { name: rewardFrom, label: Gratis verzending (EU) vanaf (€), type: number, required: true, description: "Geldt voor de landen hieronder waar 'Gratis vanaf drempel' aanstaat. Pas ook de aankondigingen bovenaan aan." }
      - name: shipping
        label: Verzending per land
        type: object
        list: true
        description: "Alleen naar deze landen kun je bestellen. Houd gelijk met de tabel op de pagina Levering & retour."
        fields:
          - { name: country, label: Landcode, type: string, required: true, description: "Twee hoofdletters: NL, BE, DE, FR…" }
          - { name: name, label: Naam van het land, type: string, required: true }
          - { name: price, label: Verzendkosten (€), type: number, required: true, description: "0 = altijd gratis." }
          - { name: freeFrom, label: Gratis vanaf drempel, type: boolean, description: "Aan = gratis vanaf het bedrag hierboven." }
          - { name: days, label: Levertijd, type: string, description: "Bijv. 2-3 werkdagen" }
      - { name: giftValue, label: Waarde van het gratis cadeau (€), type: number, required: true }
      - { name: giftText, label: Tekst cadeau op de productpagina van een thobe, type: string, description: "De waarde komt er automatisch achter, bijv. Gratis Musk & Siwak bij deze thobe" }
      - { name: giftBoxPrice, label: Meerprijs cadeaudoos (€), type: number, required: true, description: "Bovenop de prijs van de thobe (nu €5)." }
      - { name: showCompareAt, label: Van-prijs en kortingslabel tonen, type: boolean, description: "Alleen aanzetten tijdens een echte, tijdelijke actie. De doorgestreepte prijs moet de laagste prijs van de afgelopen 30 dagen zijn (Omnibus-regels); anders is het misleidend." }
      - { name: shippingText, label: Verzendtekst, type: string }
      - { name: exchangeText, label: Tekst maatruil, type: string, description: "Bijv. Gratis maatruil binnen 14 dagen (moet kloppen met de pagina Levering & retour)." }
      - name: sizes
        label: Maten
        type: object
        list: true
        description: "De letters (S, M, L, XL) staan ook in de bestelling en op het nekmerk."
        fields:
          - { name: label, label: Maat, type: string, required: true }
          - { name: bodyHeight, label: Lichaamslengte, type: string, required: true, description: "Precies zo: 1.70 – 1.78 m (de maathulp rekent hiermee)." }
          - { name: length, label: Lengte thobe (cm), type: string, description: "Van schouder tot zoom, gelijk voor slank en breed. Leeg = maattabel verbergen." }
          - { name: chestSlim, label: Borstbreedte slank (cm), type: string, description: "Plat gemeten, van oksel tot oksel (maat -1)." }
          - { name: chestBroad, label: Borstbreedte breed (cm), type: string, description: "Plat gemeten, van oksel tot oksel (maat -2)." }
          - { name: shouldersSlim, label: Schouders slank (cm), type: string }
          - { name: shouldersBroad, label: Schouders breed (cm), type: string }
          - { name: sleeveSlim, label: Mouwlengte slank (cm), type: string }
          - { name: sleeveBroad, label: Mouwlengte breed (cm), type: string }
      - name: fits
        label: Pasvormen
        type: object
        list: true
        fields:
          - { name: id, label: Code (niet wijzigen), type: string, readonly: true }
          - { name: label, label: Naam, type: string }
          - { name: note, label: Uitleg, type: text }
      - name: fabric
        label: Stof (venster "Alle stofeigenschappen")
        type: object
        fields:
          - { name: material, label: Naam van de stof, type: string }
          - { name: description, label: Omschrijving, type: text }

  - name: home
    label: Homepagina
    type: file
    path: content/home.json
    format: json
    fields:
      - name: hero
        label: Bovenaan (de doos in het zand)
        type: object
        fields:
          - { name: title, label: Kop, type: string }
          - { name: titleSecond, label: Kop tweede regel, type: string }
          - { name: text, label: Introtekst, type: text }
          - { name: buttonPrimary, label: Tekst knop in de zwarte balk, type: string, description: "Bijv. In winkelwagen" }
          - { name: buttonSecondary, label: Tekst link naar de maatkaart, type: string }
          - { name: image, label: Foto, type: image, description: "Vierkante foto met rustige ruimte links (daar staat de kop). Minstens 2000 pixels breed." }
          - { name: imageAlt, label: Beschrijving van de foto, type: string, description: "Voor blinde bezoekers en Google." }
          - { name: featuredProduct, label: Product in de zwarte balk (adres), type: string, description: "Bijv. white-desert." }
      - name: collection
        label: Kop boven de collectie
        type: object
        fields:
          - { name: title, label: Kop, type: string }
          - { name: titleSecond, label: Kop tweede regel, type: string }
          - { name: text, label: Tekst, type: text }
      - name: box
        label: Blok "De geschenkdoos"
        type: object
        fields:
          - { name: greetingArabic, label: Groet in het Arabisch, type: string }
          - { name: greeting, label: Groet uitgeschreven, type: string }
          - { name: title, label: Kop, type: string }
          - { name: titleSecond, label: Kop tweede regel, type: string }
          - { name: text, label: Tekst, type: text }
          - name: steps
            label: Stappen (zoals in het deksel)
            type: object
            list: true
            fields:
              - { name: icon, label: Icoon, type: select, options: { values: [wudu, thobe, masjid] } }
              - { name: title, label: Tekst, type: string }
          - { name: image, label: Foto open doos, type: image, description: "Bovenaanzicht, liggend." }
          - { name: imageAlt, label: Beschrijving van de foto, type: string }
          - { name: button, label: Tekst knop, type: string }
          - { name: product, label: Knop gaat naar product (adres), type: string }
      - name: promises
        label: Beloftes (zwarte strook)
        type: object
        list: true
        fields:
          - { name: icon, label: Icoon, type: select, options: { values: [exchange, shield, whatsapp, truck] } }
          - { name: title, label: Vetgedrukte tekst, type: string }
          - { name: text, label: Tekst erachter, type: string }
          - { name: whatsapp, label: Tekst is een WhatsApp-link, type: boolean }
      - name: fit
        label: Blok "De maatkaart"
        type: object
        fields:
          - { name: title, label: Kop, type: string }
          - { name: titleSecond, label: Kop tweede regel, type: string }
          - { name: text, label: Tekst, type: text }
          - { name: note, label: Kleine tekst onder de maattabel, type: string }
      - name: fabric
        label: Blok "Satijngeweven katoen"
        type: object
        fields:
          - { name: title, label: Kop, type: string }
          - { name: titleSecond, label: Kop tweede regel, type: string }
          - { name: text, label: Tekst, type: text }
          - { name: button, label: Tekst knop, type: string }
          - name: properties
            label: Stofeigenschappen (in het venster)
            type: object
            list: true
            fields:
              - { name: label, label: Eigenschap, type: string }
              - { name: text, label: Uitleg, type: text }
          - name: details
            label: Detailfoto's (knoppen onder de foto)
            type: object
            list: true
            fields:
              - { name: label, label: Naam knop, type: string, description: "Bijv. Kraag" }
              - { name: image, label: Foto, type: image, description: "Staande foto (3:4)." }
              - { name: alt, label: Beschrijving van de foto, type: string }
      - name: reviews
        label: Kop boven de reviews
        type: object
        fields:
          - { name: title, label: Kop, type: string }
          - { name: titleSecond, label: Kop tweede regel, type: string }
      - name: faq
        label: Veelgestelde vragen
        type: object
        fields:
          - { name: title, label: Kop, type: string }
          - { name: titleSecond, label: Kop tweede regel, type: string }
          - name: items
            label: Vragen
            type: object
            list: true
            fields:
              - { name: q, label: Vraag, type: string, required: true }
              - { name: a, label: Antwoord, type: text, required: true }

  - name: site
    label: Aankondigingen, contact & Google
    type: file
    path: content/site.json
    format: json
    fields:
      - name: announcements
        label: Lopende balk bovenaan
        type: object
        list: true
        fields:
          - { name: icon, label: Icoon, type: select, options: { values: [gift, truck, clock, exchange] } }
          - { name: text, label: Tekst, type: string }
      - name: contact
        label: Contactgegevens
        type: object
        fields:
          - { name: email, label: E-mailadres, type: string }
          - { name: phone, label: "Telefoonnummer zoals getoond (bijv. +31 6 41344799)", type: string }
          - { name: whatsapp, label: "WhatsApp-nummer, alleen cijfers met landcode (bijv. 31641344799)", type: string }
          - { name: instagram, label: Link naar Instagram, type: string }
      - name: legal
        label: Juridische links in de footer
        type: object
        list: true
        fields:
          - { name: label, label: Tekst, type: string }
          - { name: url, label: Link, type: string }
      - name: newsletter
        label: Nieuwsbrief (footer)
        type: object
        fields:
          - { name: title, label: Kop, type: string }
          - { name: text, label: Tekst, type: string }
          - { name: action, label: Formulier-adres van je maildienst, type: string, description: "Bijv. het 'action'-adres uit het insluitformulier van Mailchimp of Brevo (begint met https://). Leeg = geen formulier, alleen een link naar Instagram." }
          - { name: field, label: Veldnaam voor het e-mailadres, type: string, description: "Uit hetzelfde insluitformulier; bij Mailchimp EMAIL, bij Brevo EMAIL." }
      - name: seo
        label: Google & delen (SEO)
        type: object
        fields:
          - { name: title, label: Titel in Google, type: string }
          - { name: description, label: Omschrijving in Google, type: text }
      - name: company
        label: Bedrijfsgegevens (wettelijk verplicht — zonder deze gegevens kan de site niet live)
        type: object
        fields:
          - { name: name, label: Bedrijfsnaam, type: string }
          - { name: kvk, label: KvK-nummer, type: string }
          - { name: btw, label: "Btw-identificatienummer (bijv. NL001234567B01)", type: string }
          - { name: address, label: "Vestigingsadres (straat, postcode, plaats)", type: string }

  - name: reviews
    label: Reviews
    type: file
    path: content/reviews.json
    format: json
    list: true
    fields:
      - { name: name, label: Naam klant, type: string, required: true, description: "Alleen echte reviews, met toestemming. Bijv. Youssef of Youssef B." }
      - { name: place, label: Woonplaats (mag leeg), type: string }
      - { name: rating, label: Sterren (1–5), type: number, required: true }
      - { name: text, label: Review, type: text, required: true }
      - { name: product, label: Product (adres, mag leeg), type: string, description: "Bijv. white-desert. Alleen reviews met een product tellen mee voor de sterren in Google." }
      - { name: date, label: Datum, type: date, options: { format: yyyy-MM-dd } }

  - name: legal
    label: Juridische pagina's
    type: file
    path: content/legal.json
    format: json
    list: true
    fields:
      - { name: slug, label: Adres van de pagina (niet wijzigen), type: string, readonly: true }
      - { name: title, label: Titel, type: string, required: true }
      - { name: body, label: Tekst, type: rich-text, description: "Koppen, alinea's, lijsten, links en tabellen. Afbeeldingen en scripts worden geweigerd." }
